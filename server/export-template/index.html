<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Conversation</title>
<link rel="stylesheet" href="nui/css/nui-theme.css">
<link rel="stylesheet" href="player.css">
</head>
<body>
<div class="player">
    <header class="player-top">
        <div class="player-top__title" id="player-title"></div>
        <div class="player-top__counter" id="player-counter"></div>
    </header>
    <main class="player-stage" id="player-slide-content"></main>
    <footer class="player-controls">
        <div class="seek-row">
            <nui-slider id="seek-slider"><input type="range" min="0" max="0" step="50" value="0"></nui-slider>
        </div>
        <div class="controls-row">
            <nui-button variant="icon" title="Previous slide (←)">
                <button type="button" id="btn-prev" aria-label="Previous slide"><nui-icon name="arrow" class="flip-x"></nui-icon></button>
            </nui-button>
            <nui-button variant="icon" title="Play/Pause (Space)">
                <button type="button" id="btn-play" aria-label="Play or pause"><nui-icon name="play" id="play-icon"></nui-icon></button>
            </nui-button>
            <nui-button variant="icon" title="Next slide (→)">
                <button type="button" id="btn-next" aria-label="Next slide"><nui-icon name="arrow"></nui-icon></button>
            </nui-button>
            <nui-loading id="buffering-indicator" hidden></nui-loading>
            <span class="time-display" id="time-display">0:00 / 0:00</span>
        </div>
    </footer>
</div>
<script type="module" src="player.js"></script>
</body>
</html>
