<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Conversation</title>
<link rel="stylesheet" href="player.css">
</head>
<body>
<div class="player">
    <header class="player-top">
        <div class="player-top__title" id="player-title"></div>
        <div class="player-top__counter" id="player-counter"></div>
    </header>
    <main class="player-stage" id="player-slide-content"></main>
    <footer class="player-controls">
        <div class="playback-progress" id="playback-progress-bar">
            <div class="playback-progress__fill" id="playback-progress-fill"></div>
        </div>
        <div class="controls-row">
            <button type="button" id="btn-prev" title="Previous slide (←)">‹ Prev</button>
            <button type="button" id="btn-play" title="Play/Pause (Space)">Play</button>
            <button type="button" id="btn-next" title="Next slide (→)">Next ›</button>
            <span class="time-display" id="time-display">0:00 / 0:00</span>
            <select id="speed-select" title="Playback speed">
                <option value="0.75">0.75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
            </select>
        </div>
    </footer>
</div>
<script src="player.js"></script>
</body>
</html>
